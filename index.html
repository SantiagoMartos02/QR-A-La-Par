<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A La Par Espumantes</title>
<meta name="description" content="Escribinos por WhatsApp o mirá cómo llegar a la bodega A La Par Espumantes, General Alvear.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf9f4; --ink:#1c1a17; --gold:#b08d4a; --sage:#4f6350; --sage-dark:#3d4e3e; --line:#e6dfcf;
  }
  *{box-sizing:border-box;margin:0}
  html{height:100%}
  body{min-height:100vh; min-height:100dvh}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"DM Sans",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  main{width:100%; max-width:380px; text-align:center}
  h1{
    font-family:"Playfair Display",Georgia,serif;
    font-weight:500; font-size:2.3rem; line-height:1.15; text-wrap:balance;
  }
  .rule{
    height:1px; width:120px; margin:22px auto 20px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  p{font-size:1.05rem; color:#5a5648; margin-bottom:30px}
  .actions{display:grid; gap:14px}
  a.btn{
    display:flex; align-items:center; justify-content:center; gap:12px;
    min-height:60px; padding:0 20px; border-radius:4px;
    font-size:1.1rem; font-weight:500; text-decoration:none;
    transition:background-color .15s, border-color .15s, transform .1s;
  }
  a.btn svg{width:22px;height:22px;flex:none}
  a.primary{background:var(--sage); color:#fff; border:1px solid var(--sage)}
  a.primary:hover{background:var(--sage-dark)}
  a.secondary{background:transparent; color:var(--ink); border:1px solid var(--gold)}
  a.secondary:hover{background:#f3ecdc}
  a.btn:active{transform:scale(.98)}
  a.btn:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a.btn{transition:none}}
  details.hours{border:1px solid var(--gold); border-radius:4px}
  details.hours summary{
    position:relative; list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px;
    min-height:60px; padding:0 20px; font-size:1.1rem; font-weight:500;
  }
  details.hours summary::-webkit-details-marker{display:none}
  details.hours summary:hover{background:#f3ecdc}
  details.hours summary:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
  details.hours summary svg{width:22px;height:22px;flex:none}
  details.hours .chev{position:absolute; right:20px; top:50%; margin-top:-9px; width:18px;height:18px;transition:transform .15s}
  details.hours[open] .chev{transform:rotate(180deg)}
  .hours-body{text-align:center; padding:6px 20px 20px; border-top:1px solid var(--line); line-height:1.6}
  .hours-body strong{display:block; font-weight:500; margin-top:12px}
  .hours-body span{color:#5a5648}
  @media (prefers-reduced-motion:reduce){details.hours .chev{transition:none}}
</style>
</head>
<body>
<main>
  <h1>A La Par Espumantes</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>¿Cómo querés seguir?</p>
  <div class="actions">
    <a class="btn primary" href="https://wa.me/5492995879290?text=Hola%2C%20quisiera%20hacer%20una%20consulta%20sobre%20A%20La%20Par%20Espumantes." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.5A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.1 8.1 0 0 1-4.13-1.13l-.3-.18-3.1.89.9-3.02-.2-.31A8.1 8.1 0 1 1 12.04 20.1Zm4.45-6.06c-.24-.12-1.44-.71-1.66-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.1.16 1.52.1.46-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28Z"/></svg>
      Escribinos por WhatsApp
    </a>
    <a class="btn secondary" href="https://maps.app.goo.gl/zu7ecBrKZbY4g3mP8" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Cómo llegar a la bodega
    </a>
    <details class="hours">
      <summary>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Horarios
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="hours-body">
        <strong>Lunes a viernes</strong>
        <span>9:00 a 12:30 hs</span><br>
        <span>16:30 a 20:00 hs</span>
      </div>
    </details>
  </div>
  <div class="rule" aria-hidden="true" style="margin-top:34px"></div>
  <address style="font-style:normal;font-family:'Playfair Display',Georgia,serif;font-size:1.1rem">Calle Orsili 436, General Alvear</address>
</main>
</body>
</html>
